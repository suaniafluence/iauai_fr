    restart.onclick=()=>{currentQuiz=null;currentIndex=0;answers=[];lastResult=null;document.getElementById('result-score-fill').style.width='0';document.getElementById('contact-name').value='';document.getElementById('contact-role').value='';document.getElementById('contact-email').value='';document.getElementById('send-feedback').className='send-feedback';document.getElementById('send-feedback').textContent='';show('select');window.scrollTo({top:0,behavior:'smooth'});};
    document.getElementById('talk-btn').onclick=function(){
      const nameEl=document.getElementById('contact-name');
      const emailEl=document.getElementById('contact-email');
      const name=nameEl.value.trim();
      const role=document.getElementById('contact-role').value.trim();
      const email=emailEl.value.trim();
      const feedback=document.getElementById('send-feedback');
      nameEl.classList.toggle('invalid',!name);
      emailEl.classList.toggle('invalid',!email);
      if(!name||!email||!lastResult){console.warn('[talk-btn] guard bloqué — name:',!!name,'email:',!!email,'lastResult:',!!lastResult);return;}
      console.log('[EmailJS] envoi — service:',EMAILJS_SERVICE_ID,'template:',EMAILJS_TEMPLATE_ID);
      this.disabled=true;
      const emailI18n={
        greeting:{fr:'Bonjour',en:'Hello',es:'Hola',zh:'您好',ar:'مرحباً'},
        footer:{fr:'Merci pour votre intérêt. Nous vous contacterons rapidement.',en:'Thank you for your interest. We will contact you shortly.',es:'Gracias por su interés. Le contactaremos en breve.',zh:'感谢您的关注，我们将尽快与您联系。',ar:'شكراً لاهتمامك. سنتواصل معك قريباً.'}
      };
      const payload={
        name:name,
        email:email,
        reply_to:email,
        email_equipe:'contact@iauai.fr',
        locale:locale,
        greeting:emailI18n.greeting[locale]||emailI18n.greeting.en,
        footer:emailI18n.footer[locale]||emailI18n.footer.en,
        title:'[Quiz IAuAI] '+lastResult.quizTitle+' — '+lastResult.badge+' '+lastResult.level,
        message:'Quiz : '+lastResult.quizTitle+'\n'+(role?'Fonction : '+role+'\n':'')+'Score : '+lastResult.total+'/'+lastResult.max+' ('+Math.round((lastResult.total/lastResult.max)*100)+'%)\nNiveau : '+lastResult.badge+' '+lastResult.level+'\n'+lastResult.subtitle+'\n\nPoints clés :\n'+lastResult.insights.join('\n')
      };
      console.log('[EmailJS] payload:',JSON.stringify(payload));
      const feedbackMsgs={
        success:{fr:'✓ Message envoyé ! Nous vous répondrons sous 24h.',en:'✓ Message sent! We\'ll get back to you within 24h.',es:'✓ ¡Mensaje enviado! Le responderemos en menos de 24h.',zh:'✓ 消息已发送！我们将在24小时内回复您。',ar:'✓ تم إرسال الرسالة! سنرد عليك خلال 24 ساعة.'},
        error:{fr:'Erreur lors de l\'envoi. Veuillez réessayer.',en:'Error sending message. Please try again.',es:'Error al enviar el mensaje. Por favor, inténtelo de nuevo.',zh:'发送失败，请重试。',ar:'حدث خطأ أثناء الإرسال. يرجى المحاولة مرة أخرى.'}
      };
      emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,payload).then((res)=>{
        console.log('[EmailJS] succès:',res);
        feedback.textContent=feedbackMsgs.success[locale]||feedbackMsgs.success.en;
        feedback.className='send-feedback success';
        this.disabled=false;
      },(err)=>{
        console.error('[EmailJS] erreur:',err);
        feedback.textContent=feedbackMsgs.error[locale]||feedbackMsgs.error.en;
        feedback.className='send-feedback error';
        this.disabled=false;
      });
    };
    show('select');
  </script>
</body>
</html>
